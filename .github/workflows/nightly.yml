name: Nightly

# 每日构建，只服务在设置里切到 nightly 通道的用户——默认通道永远是 stable，
# nightly.json 与 latest.json 严格分开，绝不能让稳定版用户被推预览版。
#
# 与 release.yml 的关键差异：
#   · 版本号在 CI 内临时改，不 commit（pnpm version 那套只服务正式发版）
#   · 用固定的滚动 tag「nightly」，每次强制覆盖，避免 release 列表被日期 tag 淹掉
#   · 与正式版共用全局递增版本序列，渠道不预占固定的奇偶号或相邻号
#   · 发 prerelease，产 nightly.json
#   · macOS 与 Windows 共用版本，双平台产物齐全后统一发布
#   · 手动触发可通过 version 输入指定一次性版本（例如 2.0.0），仍只改 CI 工作区
#
# 需要的 secrets 与 release.yml 相同：SIGNING_CERT_P12 / SIGNING_CERT_PASSWORD /
# TAURI_SIGNING_PRIVATE_KEY / APPLE_API_PRIVATE_KEY；公开标识放在 vars.APPLE_API_KEY /
# vars.APPLE_API_ISSUER。

on:
  schedule:
    - cron: '0 18 * * *' # UTC 18:00 = 北京时间 02:00
  workflow_dispatch:
    inputs:
      version:
        description: '可选：手动指定 Nightly 版本，例如 2.0.0'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: nightly-package
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: macos-latest
    outputs:
      skip: ${{ steps.check.outputs.skip }}
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      # 定时触发时若 24h 内无提交就跳过，避免天天发同一份包
      - name: Check for new commits
        id: check
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "schedule" ] && [ -z "$(git log --since='24 hours ago' --oneline)" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "24 小时内无新提交，跳过本次 nightly"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        if: steps.check.outputs.skip == 'false'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      # 正式 tag、package.json 与当前 Nightly 共同构成版本账本。每次成功打包消耗
      # 一个新的数字版本，不论渠道：1.0.4 stable → 1.0.5 nightly → 1.0.6 stable。
      - name: Compute nightly version
        if: steps.check.outputs.skip == 'false'
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
          MANUAL_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ -n "$MANUAL_VERSION" ]; then
            if [[ ! "$MANUAL_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "手动 Nightly 版本必须是纯三段数字版本，例如 2.0.0" >&2
              exit 1
            fi
            VERSION="$MANUAL_VERSION"
            echo "手动指定 nightly 版本: $VERSION"
          else
            CANDIDATES=("$(node -p "require('./package.json').version")")
            while IFS= read -r tag; do
              CANDIDATES+=("${tag#v}")
            done < <(git tag --list 'v[0-9]*')

            ASSET_ID=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/nightly" \
              --jq '.assets[] | select(.name == "nightly.json") | .id')
            test -n "$ASSET_ID"
            NIGHTLY_VERSION=$(gh api -H 'Accept: application/octet-stream' \
              "repos/${GITHUB_REPOSITORY}/releases/assets/${ASSET_ID}" --jq '.version')
            CANDIDATES+=("$NIGHTLY_VERSION")

            VERSION=$(node scripts/next-build-version.mjs patch "${CANDIDATES[@]}")
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "nightly 版本: $VERSION"

      # 只改工作区不提交：sync-version.sh 负责三处同源 + Cargo.lock 联动 + 防呆校验，
      # package.json 需单独改（该脚本设计上假定 npm version 已经改过它）
      - name: Apply version (working tree only)
        if: steps.check.outputs.skip == 'false'
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          node -e "
            const fs = require('fs');
            const p = JSON.parse(fs.readFileSync('package.json'));
            p.version = process.env.VERSION;
            fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
          "
          npm_package_version="$VERSION" bash scripts/sync-version.sh

      # 用同一份版本文件驱动两端，避免各自计算版本或改写版本字段。
      - name: Share versioned manifests
        if: steps.check.outputs.skip == 'false'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nightly-version-manifests
          path: |
            package.json
            src-tauri/tauri.conf.json
            src-tauri/Cargo.toml
            src-tauri/Cargo.lock
          if-no-files-found: error

  build-windows:
    needs: prepare
    if: needs.prepare.outputs.skip == 'false'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Restore versioned manifests
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: nightly-version-manifests
          path: .

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Rust cache
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: pnpm install

      - name: Build NSIS installer
        run: pnpm tauri build --bundles nsis

      - name: Sign updater artifact
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        shell: pwsh
        run: |
          $signingKey = $env:TAURI_SIGNING_PRIVATE_KEY
          $signingPassword = $env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD
          Remove-Item Env:TAURI_SIGNING_PRIVATE_KEY
          Remove-Item Env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD
          $exe = Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          $env:TAURI_SIGNING_PRIVATE_KEY = $signingKey
          $env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD = $signingPassword
          if (-not $exe) { throw "Windows installer missing" }
          pnpm tauri signer sign $exe.FullName
          if ($LASTEXITCODE -ne 0) { throw "Updater signing failed" }
          Remove-Item Env:TAURI_SIGNING_PRIVATE_KEY
          Remove-Item Env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nightly-windows-nsis
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.sig
          if-no-files-found: error

  build-macos:
    needs: [prepare, build-windows]
    if: needs.prepare.outputs.skip == 'false'
    runs-on: macos-latest
    env:
      SIGN_ID: ${{ vars.MACOS_SIGNING_IDENTITY || 'Monet Signing' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # 发布说明需要上次 Nightly 以来的历史

      - name: Restore versioned manifests
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: nightly-version-manifests
          path: .

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Rust cache
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri -> target

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Import signing certificate
        env:
          CERT_P12: ${{ secrets.SIGNING_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          CERT_P12_VALUE="$CERT_P12"
          CERT_PASSWORD_VALUE="$CERT_PASSWORD"
          unset CERT_P12 CERT_PASSWORD
          CERT_FILE=$(mktemp "$RUNNER_TEMP/monet-signing-cert.XXXXXX.p12")
          trap 'rm -f "$CERT_FILE"' EXIT
          KEYCHAIN_PASS="ci-$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASS" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASS" build.keychain
          security set-keychain-settings -lut 3600 build.keychain
          printf '%s' "$CERT_P12_VALUE" | base64 -d > "$CERT_FILE"
          unset CERT_P12_VALUE
          security import "$CERT_FILE" -k build.keychain -P "$CERT_PASSWORD_VALUE" -T /usr/bin/codesign
          unset CERT_PASSWORD_VALUE
          rm -f "$CERT_FILE"
          security set-key-partition-list -S 'apple-tool:,apple:,codesign:' -s -k "$KEYCHAIN_PASS" build.keychain
          if [ "$SIGN_ID" = "Monet Signing" ]; then
            security find-certificate -c "$SIGN_ID" -p build.keychain > /tmp/cert.pem
            sudo security add-trusted-cert -d -r trustRoot -p codeSign -k /Library/Keychains/System.keychain /tmp/cert.pem
            rm -f /tmp/cert.pem
          fi
          IDENTITIES=$(security find-identity -v -p codesigning)
          grep -F "$SIGN_ID" <<< "$IDENTITIES" >/dev/null

      - name: Install dependencies
        run: pnpm install

      - name: Build app
        run: pnpm tauri build --bundles app --config "{\"bundle\":{\"macOS\":{\"signingIdentity\":\"$SIGN_ID\"}}}"

      - name: Bundle tray helper
        run: bash scripts/bundle-tray.sh

      - name: Build widget, sign, package
        env:
          DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
          APPLE_API_KEY: ${{ vars.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ vars.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          exec src-widget/build.sh

      - name: Verify signature
        run: |
          set -euo pipefail
          APP=src-tauri/target/release/bundle/macos/Monet.app
          codesign --verify --deep --strict "$APP"
          DETAILS=$(codesign -dvv "$APP" 2>&1)
          if grep -F 'Signature=adhoc' <<< "$DETAILS" >/dev/null; then
            echo 'Unexpected ad-hoc signature' >&2
            exit 1
          fi

      - name: Download Windows installer
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: nightly-windows-nsis
          path: windows-artifacts

      # build.sh 产的 latest.json 里 URL 指向 v<version> tag，对 nightly 是错的；
      # 这里用滚动 tag 重新生成，并且落到 nightly.json——latest.json 不上传
      - name: Generate nightly.json
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_TAG: nightly
        run: |
          set -euo pipefail
          TARBALL=$(ls src-tauri/target/release/bundle/updater/*.app.tar.gz)
          WIN_EXE=$(ls windows-artifacts/*.exe)
          CHANGES_FILE="$RUNNER_TEMP/nightly-changes.txt"
          NOTES_FILE="$RUNNER_TEMP/nightly-release-notes.json"
          if git rev-parse --verify nightly >/dev/null 2>&1; then
            git log nightly..HEAD --pretty=format:'%s' -n 8 > "$CHANGES_FILE"
          else
            git log --since='24 hours ago' --pretty=format:'%s' -n 8 > "$CHANGES_FILE"
          fi
          node scripts/release-notes.mjs nightly "$VERSION" "$CHANGES_FILE" "$NOTES_FILE"
          RELEASE_NOTES_FILE="$NOTES_FILE" node scripts/create-latest-json.mjs "$VERSION" "$TARBALL" \
            src-tauri/target/release/bundle/updater/nightly.json "$WIN_EXE"
          echo "NIGHTLY_RELEASE_NOTES_FILE=$NOTES_FILE" >> "$GITHUB_ENV"
          cat src-tauri/target/release/bundle/updater/nightly.json

      # 先上传并校验隐藏候选，再切换滚动入口；切换失败自动恢复旧版。
      - name: Publish rolling nightly release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          bash scripts/publish-nightly.sh
